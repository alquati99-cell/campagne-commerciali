<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0d1b2e;
    --navy-mid: #152540;
    --navy-light: #1e3258;
    --white: #f8f9fc;
    --text: #1a2540;
    --muted: #6b7a99;
    --border: rgba(255,255,255,0.08);

    --motor: #3b82f6;
    --rami: #8b5cf6;
    --salute: #06b6d4;
    --protection: #ef4444;
    --investimento: #22c55e;
    --altro: #94a3b8;

    --badge-attiva: #22c55e;
    --badge-arrivo: #f59e0b;
    --badge-scadenza: #3b82f6;
    --badge-semestrale: #8b5cf6;
  }

  html, body { height: 100%; background: var(--navy); font-family: 'DM Sans', sans-serif; color: var(--white); overflow-x: hidden; }

  #root { min-height: 100vh; }

  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  .app-wrap { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 0 32px 80px; }

  /* HEADER */
  .header {
    padding: 48px 0 40px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .header-left {}
  .header-eyebrow {
    font-family: 'Outfit', sans-serif;
    font-size: 11px; font-weight: 600; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 10px;
  }
  .header-title {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(28px, 4vw, 48px); font-weight: 800;
    line-height: 1; letter-spacing: -0.03em;
    color: var(--white);
  }
  .header-title span { color: #3b82f6; }
  .header-year {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(48px, 7vw, 88px); font-weight: 800;
    color: rgba(255,255,255,0.04); line-height: 1;
    letter-spacing: -0.05em; user-select: none;
  }

  /* TABS */
  .tabs-bar {
    display: flex; gap: 4px;
    background: var(--navy-mid);
    border-radius: 16px; padding: 6px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }
  .tab-btn {
    flex: 1; min-width: 100px;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 18px; border-radius: 12px; border: none;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500;
    background: transparent; color: var(--muted);
    transition: all 0.2s; white-space: nowrap;
    justify-content: center;
  }
  .tab-btn:hover { background: rgba(255,255,255,0.05); color: var(--white); }
  .tab-btn.active { background: var(--navy-light); color: var(--white); }
  .tab-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .tab-count {
    margin-left: auto; padding: 2px 7px; border-radius: 20px;
    font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.08);
  }

  /* CAROUSEL */
  .carousel-wrap {
    position: relative;
    width: 100%;
    height: 520px;
    perspective: 1200px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  .carousel-stage {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
  }

  .carousel-item {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 420px;
    transform-origin: center center;
    cursor: pointer;
    transition: transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                opacity 0.55s ease,
                filter 0.55s ease;
  }

  /* NAV ARROWS */
  .carousel-nav {
    display: flex; align-items: center; justify-content: center;
    gap: 16px; margin-top: 28px;
  }
  .carousel-arrow {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--navy-mid); border: 1px solid rgba(255,255,255,0.12);
    color: var(--white); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; font-size: 18px;
  }
  .carousel-arrow:hover { background: var(--navy-light); transform: scale(1.05); }
  .carousel-arrow:disabled { opacity: 0.25; cursor: default; transform: none; }

  .carousel-dots {
    display: flex; gap: 6px; align-items: center;
  }
  .carousel-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: all 0.2s; cursor: pointer; border: none; padding: 0;
  }
  .carousel-dot.active {
    width: 20px; border-radius: 3px;
    background: var(--accent-color, #3b82f6);
  }

  /* CARD */
  .campaign-card {
    background: var(--navy-mid);
    border-radius: 20px;
    border: 1px solid var(--border);
    padding: 0;
    overflow: hidden;
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    height: 480px;
  }

  .card-top-bar { height: 4px; width: 100%; flex-shrink: 0; }
  .card-illustration {
    width: 100%; height: 160px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative; flex-shrink: 0;
  }
  .card-illustration img {
    width: 100%; height: 100%; object-fit: cover; object-position: center;
    display: block;
  }
  .card-illustration svg { width: 100%; height: 100%; }
  .card-body {
    padding: 20px 24px 20px;
    flex: 1; display: flex; flex-direction: column;
  }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .card-desc {
    font-size: 13px; color: var(--muted); line-height: 1.6;
    margin-bottom: 14px; flex: 1;
  }
  .card-meta {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
    margin-bottom: 16px;
    min-height: 20px; flex-wrap: nowrap;
  }
  .card-meta span { flex-shrink: 0; }
  .card-actions { display: flex; gap: 8px; margin-top: auto; }

  .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .card-title {
    font-family: 'Outfit', sans-serif;
    font-size: 17px; font-weight: 700; line-height: 1.25;
    color: var(--white);
    flex: 1;
  }
  .card-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em;

  .badge-dot { width: 6px; height: 6px; border-radius: 50%; }

  .badge-attiva { background: rgba(34,197,94,0.15); color: #4ade80; }
  .badge-attiva .badge-dot { background: #4ade80; }
  .badge-arrivo { background: rgba(245,158,11,0.15); color: #fbbf24; }
  .badge-arrivo .badge-dot { background: #fbbf24; }
  .badge-scadenza { background: rgba(59,130,246,0.15); color: #60a5fa; }
  .badge-scadenza .badge-dot { background: #60a5fa; }

  .card-desc {
    font-size: 13px; color: var(--muted); line-height: 1.6;
    margin-bottom: 18px;
  }

  .card-meta {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
    margin-bottom: 20px;
  }
  .card-meta svg { opacity: 0.5; flex-shrink: 0; }

  .card-actions { display: flex; gap: 8px; }
  .btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 10px 14px; border-radius: 10px; border: none;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.15s;

  .btn-download {
    background: rgba(255,255,255,0.07);

  .btn-download:hover { background: rgba(255,255,255,0.12); }

    color: #4ade80;
    border: 1px solid rgba(37,211,102,0.2);
  }
  .btn-whatsapp:hover { background: rgba(37,211,102,0.2); }

  /* ── MAPPA VIEW ─────────────────────────────────────── */
  .mappa-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 60px;
  }
  @media (max-width: 900px) { .mappa-grid { grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 580px) { .mappa-grid { grid-template-columns: 1fr; } }

  .mappa-tile {
    background: var(--navy-mid);
    border-radius: 20px;
    border: 1px solid var(--border);
    overflow: hidden;
    cursor: default;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    position: relative;
  }
  .mappa-tile:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .mappa-tile-header {
    padding: 28px 28px 20px;
    display: flex; align-items: center; gap: 14px;
    position: relative; z-index: 2;
  }
  .mappa-tile-icon {
    width: 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .mappa-tile-name {
    font-family: 'Outfit', sans-serif;
    font-size: 20px; font-weight: 700; color: var(--white);
    flex: 1;
  }
  .mappa-tile-count {
    font-family: 'Outfit', sans-serif;
    font-size: 13px; font-weight: 600;
    padding: 4px 10px; border-radius: 20px;
  }

    max-height: 0;
    overflow: hidden;
    transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1),

    opacity: 0;
    padding: 0 20px;

  .mappa-tile:hover .mappa-campaigns {
    max-height: 600px;
    opacity: 1;
    padding: 0 20px 20px;
  }

  .mappa-campaign-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 10px;
    margin-bottom: 6px;
    background: rgba(255,255,255,0.04);
    transition: background 0.15s;

  .mappa-campaign-row:hover { background: rgba(255,255,255,0.08); }
  .mappa-campaign-row:last-child { margin-bottom: 0; }

  .mappa-campaign-title {
    font-size: 13px; font-weight: 500; color: var(--white);
    flex: 1; line-height: 1.3;

  .mappa-campaign-badge {
    font-size: 10px; font-weight: 600; padding: 3px 8px;
    border-radius: 20px; flex-shrink: 0;
    display: flex; align-items: center; gap: 4px;

  .mappa-campaign-badge .badge-dot { width: 5px; height: 5px; border-radius: 50%; }

  /* divider */
  .mappa-divider {
    height: 1px; background: var(--border);
    margin: 0 20px;
    transition: opacity 0.3s;
  }
  .mappa-tile:hover .mappa-divider { opacity: 1; }
  .mappa-tile:not(:hover) .mappa-divider { opacity: 0; }

  /* BG glow */
  .mappa-tile-bg {
    position: absolute; inset: 0; z-index: 0;
    opacity: 0; transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .mappa-tile:hover .mappa-tile-bg { opacity: 1; }

  /* VIEW TOGGLE */
  .view-toggle {
    display: flex; gap: 4px;
    background: var(--navy-mid);
    border-radius: 10px; padding: 4px;
    margin-left: auto;

  .view-toggle-btn {

    background: transparent; color: var(--muted); transition: all 0.15s;

  .view-toggle-btn.active { background: var(--navy-light); color: var(--white); }

  /* EMPTY */
  .empty-state {
    grid-column: 1/-1; text-align: center;
    padding: 80px 0; color: var(--muted);
    font-size: 15px;
  }
  .empty-state h3 { font-family: 'Outfit', sans-serif; font-size: 22px; margin-bottom: 8px; color: rgba(255,255,255,0.3); }

  /* TWEAKS */
  .tweaks-panel {
    position: fixed; bottom: 28px; right: 28px;
    background: #1e3258; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px; padding: 20px 24px; width: 260px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    z-index: 100; font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    animation: tweaksIn 0.2s ease;
  }
  @keyframes tweaksIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .tweaks-title { font-family:'Outfit',sans-serif; font-weight:700; font-size:14px; margin-bottom:16px; color:var(--white); display:flex; align-items:center; justify-content:space-between; }
  .tweaks-row { margin-bottom:14px; }
  .tweaks-label { color:var(--muted); margin-bottom:6px; font-size:12px; }
  .tweaks-options { display:flex; gap:6px; flex-wrap:wrap; }
  .tweak-opt {
    padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
    background: transparent; color: var(--muted); font-size: 12px;
    cursor: pointer; transition: all 0.15s; font-family:'DM Sans',sans-serif;
  }
  .tweak-opt.sel { background: rgba(59,130,246,0.2); color: #60a5fa; border-color: rgba(59,130,246,0.4); }

  /* TOAST */
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: #1e3258; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 12px 20px;
    font-size: 13px; color: var(--white);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    z-index: 200; pointer-events: none;
    animation: toastIn 0.2s ease;
  }
  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(8px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
</style>

// ── CAROUSEL ──────────────────────────────────────────────────────────────
function Carousel({ campaigns, tabColor, showDesc, onToast }) {
  const savedKey = `cc_idx_${campaigns[0]?.id?.charAt(0) || 'x'}`;
  const [idx, setIdx] = useState(() => {
    const s = parseInt(localStorage.getItem(savedKey) || '0', 10);
    return Math.min(s, Math.max(0, campaigns.length - 1));
  });

  useEffect(() => { localStorage.setItem(savedKey, idx); }, [idx, savedKey]);

  // keyboard nav
  useEffect(() => {
    const handler = (e) => {
      if (e.key === 'ArrowLeft')  setIdx(i => Math.max(0, i - 1));
      if (e.key === 'ArrowRight') setIdx(i => Math.min(campaigns.length - 1, i + 1));
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [campaigns.length]);

  // touch/drag
  const dragStart = React.useRef(null);
  const onPointerDown = (e) => { dragStart.current = e.clientX; };
  const onPointerUp = (e) => {
    if (dragStart.current === null) return;
    const dx = e.clientX - dragStart.current;
    if (dx < -40) setIdx(i => Math.min(campaigns.length - 1, i + 1));
    if (dx >  40) setIdx(i => Math.max(0, i - 1));
    dragStart.current = null;
  };

  if (!campaigns.length) return (
    <div className="empty-state">
      <h3>Nessuna campagna</h3>
      <p>Non ci sono campagne per questa categoria.</p>
    </div>
  );

  const getStyle = (i) => {
    const offset = i - idx;
    const absOff = Math.abs(offset);
    if (absOff > 3) return { display: 'none' };

    const tx = offset * 280;
    const tz = -absOff * 120;
    const ry = offset * -28;
    const scale = absOff === 0 ? 1 : absOff === 1 ? 0.82 : absOff === 2 ? 0.68 : 0.56;
    const opacity = absOff === 0 ? 1 : absOff === 1 ? 0.7 : absOff === 2 ? 0.4 : 0.2;
    const blur = absOff === 0 ? 0 : absOff * 1.5;
    const zIndex = 10 - absOff;

    return {
      transform: `translateX(calc(-50% + ${tx}px)) translateY(-50%) translateZ(${tz}px) rotateY(${ry}deg) scale(${scale})`,
      opacity,
      filter: blur > 0 ? `blur(${blur}px)` : 'none',
      zIndex,
      pointerEvents: absOff === 0 ? 'auto' : 'none',
    };
  };

  return (
    <div>
      <div
        className="carousel-wrap"
        onPointerDown={onPointerDown}
        onPointerUp={onPointerUp}
        style={{ '--accent-color': tabColor }}
      >
        <div className="carousel-stage">
          {campaigns.map((c, i) => (
            <div key={c.id} className="carousel-item" style={getStyle(i)} onClick={() => setIdx(i)}>
              <CampaignCard campaign={c} tabColor={tabColor} showDesc={showDesc} onToast={onToast} isActive={i === idx} />
            </div>
          ))}
        </div>
      </div>

      <div className="carousel-nav">
        <button className="carousel-arrow" onClick={() => setIdx(i => Math.max(0, i - 1))} disabled={idx === 0}>‹</button>
        <div className="carousel-dots">
          {campaigns.map((_, i) => (
            <button key={i} className={`carousel-dot ${i === idx ? 'active' : ''}`} onClick={() => setIdx(i)} style={i === idx ? { background: tabColor } : {}} />
          ))}
        </div>
        <button className="carousel-arrow" onClick={() => setIdx(i => Math.min(campaigns.length - 1, i + 1))} disabled={idx === campaigns.length - 1}>›</button>
      </div>
    </div>
  );
}

              {currentTab?.label}
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              {['attiva', 'scadenza', 'arrivo'].map(s => {
                const n = campaigns.filter(c => c.status === s).length;
                if (!n) return null;
                const st = STATUS[s];
                return (
                  <span key={s} className={`card-badge ${st.cls}`} style={{ fontSize: 12 }}>
                    <div className="badge-dot" />{n} {st.label.toLowerCase()}
                  </span>
                );
              })}
            </div>
          </div>

          {/* CAROUSEL */}
          <Carousel
            key={activeTab}
            campaigns={campaigns}
            tabColor={currentTab?.color}
            showDesc={showDesc}
            onToast={showToast}
          />
        </>
      )}

      {/* TWEAKS */}
      {showTweaks && (
        <div className="tweaks-panel">
          <div className="tweaks-title">
            Tweaks
            <span style={{fontSize:11, color:'var(--muted)', fontWeight:400}}>Personalizza</span>
          </div>

          <div className="tweaks-row">
            <div className="tweaks-label">Layout card</div>
            <div className="tweaks-options">
              {['grid', 'list'].map(v => (
                <button key={v} className={`tweak-opt ${layout === v ? 'sel' : ''}`} onClick={() => applyTweak('layout', v)}>
                  {v === 'grid' ? 'Griglia' : 'Lista'}
                </button>
              ))}
            </div>
          </div>

          <div className="tweaks-row">
            <div className="tweaks-label">Descrizione campagne</div>
            <div className="tweaks-options">
              <button className={`tweak-opt ${showDesc ? 'sel' : ''}`} onClick={() => applyTweak('showDesc', true)}>Visibile</button>
              <button className={`tweak-opt ${!showDesc ? 'sel' : ''}`} onClick={() => applyTweak('showDesc', false)}>Nascosta</button>
            </div>
          </div>

          <div className="tweaks-row">
            <div className="tweaks-label">Stile card</div>
            <div className="tweaks-options">
              {['standard', 'compact'].map(v => (
                <button key={v} className={`tweak-opt ${cardStyle === v ? 'sel' : ''}`} onClick={() => applyTweak('cardStyle', v)}>
                  {v === 'standard' ? 'Standard' : 'Compatto'}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* TOAST */}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
